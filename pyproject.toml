[project]
name = "index-translate-inference"
version = "0.1.0"
description = "Local inference tools for the Index-Translate model family"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40,<3",
    "httpx>=0.27,<1",
    "huggingface-hub>=1.5,<2",
    "transformers==5.6.0",
    "tokenizers==0.22.2",
    "librosa==1.0.0",
    "onnxruntime==1.30.0",
    "wetext==0.0.4",
    "kaldifst==1.8.0",
    "conformer==0.3.2",
    "hydra-core==1.3.7",
    "HyperPyYAML==1.2.3",
    "lightning==2.6.6",
    "x-transformers==2.11.24",
    "einx==0.4.3",
    "frozendict==2.4.7",
    "pyworld==0.3.5",
    "soundfile==0.13.1",
    "modelscope==1.37.1",
    "safetensors==0.7.0",
    "numpy==2.4.6",
    "inflect==7.5.0",
    "diffusers==0.29.0",
    "pyarrow==25.0.1",
    "gdown==6.4.1",
    "matplotlib==3.11.2",
    "wget==3.2",
    "pykakasi==2.3.0",
    "openai-whisper==20250625",
    "pyopenjtalk-plus==0.4.1.post9; sys_platform == 'win32'",
    "silero-vad>=6.0,<7",
]

[project.optional-dependencies]
cu130 = ["torch==2.11.0", "torchaudio==2.11.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "cu130" }]
torchaudio = [{ index = "pytorch-cu130", extra = "cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
